version: "2"
sql:
  - engine: "postgresql"
    queries: "../internal/query"
    schema: "../migrations"
    gen:
      go:
        package: "query"
        out: "../internal/query"
        sql_package: "pgx/v5"
        # Querier заменяет рукописный repository/store-интерфейс: сервис зависит
        # от него и тестируется фейком без БД. Без emit_interface тестового шва
        # не остаётся и репозиторий приходится писать руками.
        emit_interface: true
        overrides:
          # UUID
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          # Время
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # Текстовые
          - db_type: "text"
            go_type: "string"
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "varchar"
            go_type: "string"
          - db_type: "varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          # Числовые
          - db_type: "smallint"
            go_type: "int16"
          - db_type: "integer"
            go_type: "int"
          - db_type: "bigint"
            go_type: "int64"
          - db_type: "bool"
            go_type: "bool"

          # sqlc сопоставляет override по ВНУТРЕННЕМУ имени типа Postgres, а не
          # по алиасу. Для nullable-параметров `db_type: "bigint"` не
          # применяется — нужен pg_catalog.int8. Без этих трёх строк nullable
          # остаётся pgtype.* и сервис пишет конвертеры вручную, ради устранения
          # которых sqlc и внедряют.
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true

          # JSON
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "json"
            go_type: "encoding/json.RawMessage"
