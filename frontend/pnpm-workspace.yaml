packages:
  - applications/*
  - packages/*

# Catalog — единственное место, где записана версия общей зависимости.
# В package.json пакета пишется `"vue": "catalog:"`, поэтому обновление версии
# делается одной правкой здесь, а не грепом по всем манифестам.
catalog:
  # ядро
  typescript: ^5.9.3
  '@types/node': ^22.15.3
  nuxt: ^4.0.3
  vue: ^3.5.18
  vue-router: ^4.5.1
  pinia: ^3.0.3
  '@pinia/nuxt': ^0.11.2
  '@vueuse/core': ^13.5.0
  '@vueuse/nuxt': ^13.5.0

  # стили
  sass: ^1.89.2
  sass-embedded: ^1.89.2

  # транспорт и данные
  zod: ^3.25.76
  date-fns: ^4.1.0

  # сборка пакетов
  vite: ^6.3.5
  '@vitejs/plugin-vue': ^5.2.4
  vue-tsc: ^2.2.10
  unplugin-auto-import: ^19.3.0
  resolve-tspaths: ^0.8.23

  # storybook
  storybook: ^8.6.14
  # Рендерер объявляется явно, а не берётся транзитивно из vue3-vite: истории
  # импортируют Meta/StoryObj именно отсюда, а pnpm не поднимает транзитивные
  # пакеты в node_modules потребителя.
  '@storybook/vue3': ^8.6.14
  '@storybook/vue3-vite': ^8.6.14
  '@storybook/addon-essentials': ^8.6.14
  '@storybook/addon-links': ^8.6.14
  eslint-plugin-storybook: ^0.12.0

  # качество
  eslint: ^9.30.1
  '@eslint/js': ^9.30.1
  typescript-eslint: ^8.36.0
  eslint-plugin-vue: ^10.2.0
  vue-eslint-parser: ^10.1.4
  eslint-config-prettier: ^10.1.5
  eslint-plugin-prettier: ^5.5.1
  prettier: ^3.6.2
  '@nuxt/eslint-config': ^1.5.2

  # тесты
  vitest: ^3.2.4
  '@vitest/coverage-v8': ^3.2.4
  '@vue/test-utils': ^2.4.6
  happy-dom: ^18.0.1

onlyBuiltDependencies:
  - esbuild
